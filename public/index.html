  --teal:#0e7c86;--violet:#6d4bc0;--hover:#eef3f8;--land:#e3e9f0;--sea:#f6f9fb;--scrim:rgba(8,16,28,.48);
  --c1:#0a64c2;--c2:#0e7c86;--c3:#b45309;--c4:#6d4bc0;--c5:#5a6878;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b131d;--panel:#121c28;--panel2:#0f1822;--ink:#e4ebf3;--muted:#97a6b8;--line:#223142;--line2:#33475e;
  --accent:#58a2f0;--on-accent:#06111d;--accent-soft:#14304d;
  --shell:#08111b;--shell2:#14263b;--shell-ink:#e4ebf3;--shell-muted:#8ea2b8;
  --ok:#4cc483;--ok-soft:#10301e;--warn:#f0b04a;--warn-soft:#3a2b0f;--bad:#ff7d70;--bad-soft:#3e1a17;
  --teal:#42c0c9;--violet:#a68ff0;--hover:#182737;--land:#1b2a3b;--sea:#0f1822;--scrim:rgba(0,0,0,.6);
  --c1:#58a2f0;--c2:#42c0c9;--c3:#f0b04a;--c4:#a68ff0;--c5:#97a6b8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b131d;--panel:#121c28;--panel2:#0f1822;--ink:#e4ebf3;--muted:#97a6b8;--line:#223142;--line2:#33475e;

  --shell:#08111b;--shell2:#14263b;--shell-ink:#e4ebf3;--shell-muted:#8ea2b8;
  --ok:#4cc483;--ok-soft:#10301e;--warn:#f0b04a;--warn-soft:#3a2b0f;--bad:#ff7d70;--bad-soft:#3e1a17;

  --c1:#58a2f0;--c2:#42c0c9;--c3:#f0b04a;--c4:#a68ff0;--c5:#97a6b8;color-scheme:dark}
*{box-sizing:border-box}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lg-brand{background:var(--shell);color:var(--shell-ink);padding:48px max(32px,env(safe-area-inset-left,0px)) 48px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}

.lg-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:520px}

@media(max-width:820px){.login{grid-template-columns:minmax(0,1fr)}.lg-brand{padding:28px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}.lg-brand h1{font-size:23px}.lg-flow{display:none}.lg-form{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));align-items:flex-start}}

/* ---------- shell ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--shell);color:var(--shell-ink);border-bottom:1px solid var(--shell2)}
.top-in{display:flex;align-items:center;gap:12px;height:54px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0;white-space:nowrap}

.logo{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.search{flex:1;max-width:460px;margin-left:16px}

.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.nt{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:2px}
.nt:hover{background:var(--hover)}.nt.u{box-shadow:inset 3px 0 0 var(--accent)}

.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 24px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:1px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));height:calc(100vh - 54px - env(safe-area-inset-top,0px));overflow-y:auto}

/* ---------- page parts ---------- */
.ph{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}

.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line2);white-space:nowrap}

.kpi.bad{box-shadow:inset 0 3px 0 var(--bad)}.kpi.warn{box-shadow:inset 0 3px 0 var(--warn)}.kpi.ok{box-shadow:inset 0 3px 0 var(--ok)}.kpi.acc{box-shadow:inset 0 3px 0 var(--accent)}
.kpi.bad .v{color:var(--bad)}
.grid{display:grid;gap:14px;margin-bottom:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.grid.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:1100px){.grid.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.hd h2{font-size:13.5px;font-weight:600;margin:0}
.panel>.hd span{font-size:12px;color:var(--muted)}
.panel>.bd{padding:14px 16px}
.panel>.bd.flush{padding:0}
.chart{width:100%;height:auto;display:block}
.ax{fill:var(--muted);font:11px var(--f-body)}.gl{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}.ar{fill:var(--accent);opacity:.1}
.bar-a{fill:var(--accent)}.bar-b{fill:var(--c2)}.dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.vl{fill:var(--ink);font:600 11px var(--f-body)}
.hb{display:grid;grid-template-columns:minmax(84px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .tr{height:10px;border-radius:5px;background:var(--hover);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}

.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.02em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr.rw{cursor:pointer}table.t tr.rw:hover td{background:var(--hover)}

.mono{font-family:var(--f-mono);font-size:12.5px;font-weight:500}

.tag{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 7px;background:var(--hover);color:var(--muted);white-space:nowrap}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover{filter:brightness(1.07)}

.btn.sm{padding:4px 10px;font-size:12.5px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flt{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.flt label,.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;min-height:34px;color:var(--ink);max-width:100%}

/* ---------- map ---------- */
.map{width:100%;height:auto;display:block;background:var(--sea);border-radius:6px}

/* ---------- drawer ---------- */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:50}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:51;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.dr-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
.dr-b{padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.x{margin-left:auto}

.next{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:6px}

.tl li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl li::before{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:2px;background:var(--line)}

(function(){
"use strict";

/* ================= reference data ================= */

 ['PLS','Perlis','Northern','Kangar',6.4414,100.1986,2],

 ['SGR','Selangor','Central','Klang',3.0449,101.4456,14],
 ['KUL','WP Kuala Lumpur','Central','Kuala Lumpur',3.1390,101.6869,14],
 ['PJY','WP Putrajaya','Central','Putrajaya',2.9264,101.6964,4],
 ['NSN','Negeri Sembilan','Southern','Seremban',2.7258,101.9424,4],
 ['MLK','Melaka','Southern','Melaka',2.1896,102.2501,4],
 ['JHR','Johor','Southern','Johor Bahru',1.4927,103.7414,10],
 ['PHG','Pahang','East Coast','Kuantan',3.8077,103.3260,5],
 ['TRG','Terengganu','East Coast','Kuala Terengganu',5.3302,103.1408,4],
 ['KTN','Kelantan','East Coast','Kota Bharu',6.1254,102.2381,4],

const ZONE=s=>s.region==='East Malaysia'?'C':['SGR','KUL','PJY','NSN'].includes(s.id)?'A':'B';
const ZN={A:'Zone A · Klang Valley',B:'Zone B · Peninsular',C:'Zone C · East Malaysia'};
const ITEMS=['HDD 2.4TB SAS 10K','System board X-series','Power supply 750W','RAID controller 12Gb','DDR4 32GB RDIMM','Fan module hot-swap','NIC 10GbE dual port','Switch module 24-port','Laptop LCD panel 14"','SSD 960GB enterprise','Router line card','Optical transceiver SFP+'];

const EV=['created','validated','assigned','collected','transit','delivered','decided','vconfirm','completed'];
const SC={'Request Created':'var(--muted)','Pending Vendor Assignment':'var(--warn)','Driver Assigned':'var(--accent)','Collected from Warehouse':'var(--accent)','In Transit':'var(--teal)','Delivered':'var(--violet)','Accepted':'var(--ok)','Rejected':'var(--bad)','Completed':'var(--ok)'};

const ACTIVE=['Driver Assigned','Collected from Warehouse','In Transit'];

/* ================= store ================= */
// The server holds the shared database. save() sends only the records that changed since the last load.
let DB=null,SNAP=null,syncQ=Promise.resolve(),syncing=0;
const S={nr:{},uid:null,view:'',q:'',f:{},lim:25,sel:null,tmp:{},pop:'',nav:false,period:'90',rep:'delivery',adm:'users',mapM:'req',mapSel:null,vsel:'',costLim:20,form:null,pwForm:false,jt:'new',jlim:10};
const COLL=['users','vendors','drivers','bases','routes','reqs','notifs','audit'],DELC=['users','bases','routes','reqs'],SETK=['sla','rates','ch'];
// The offline edition (one HTML file) answers the same API in the browser through window.HWOTG_LOCAL.
const LOCAL=window.HWOTG_LOCAL||null;
async function api(p,b){let r,j={};
  if(LOCAL){const x=await LOCAL.api(p,b===undefined?{}:JSON.parse(JSON.stringify(b)));r={status:x.status,ok:x.status<300};j=x.body||{}}
  else{const o={credentials:'same-origin',method:b===undefined?'GET':'POST'};if(b!==undefined){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(b)}
    try{r=await fetch(p,o)}catch(e){throw new Error('Cannot reach the server. Check the internet connection.')}
    try{j=await r.json()}catch(e){}}
  if(r.status===401&&p!=='/api/login'){signedOut();throw new Error(j.error||'Sign in again.')}
  if(!r.ok)throw new Error(j.error||'Request failed ('+r.status+')');return j}
function snapOf(d){const s={};COLL.forEach(c=>{const m=new Map();(d[c]||[]).forEach(x=>m.set(String(x.id),JSON.stringify(x)));s[c]=m});SETK.forEach(k=>s[k]=JSON.stringify(d[k]));return s}
function diff(){const cur=snapOf(DB),up={},dl={};let n=0;
  COLL.forEach(c=>{const a=[];cur[c].forEach((j,id)=>{if(SNAP[c].get(id)!==j)a.push(JSON.parse(j))});if(a.length){up[c]=a;n++}
    if(DELC.includes(c)){const d=[...SNAP[c].keys()].filter(id=>!cur[c].has(id));if(d.length){dl[c]=d;n++}}});
  const st={};SETK.forEach(k=>{if(cur[k]!==SNAP[k]){st[k]=DB[k];n++}});SNAP=cur;return n?{upserts:up,deletes:dl,settings:Object.keys(st).length?st:null}:null}
function save(){if(!DB||!SNAP)return true;const p=diff();if(!p)return true;syncing++;
  syncQ=syncQ.then(()=>api('/api/sync',p)).catch(e=>{if(S.uid)toast((e.message||'Could not save')+' Showing the latest saved data.')}).finally(()=>{syncing--;if(!syncing&&S.uid)refresh()});return true}
async function loadData(){const d=await api('/api/data');DB=d;SNAP=snapOf(DB);S.uid=d.uid}
const busy=()=>{const a=document.activeElement;return S.view==='new'||!!S.form||S.pwForm||!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||!!(S.sel&&$('#layer .f'))};
async function refresh(){try{await loadData()}catch(e){return}if(!me())return signedOut();checkAlerts();
  renderNav();renderBadge();if(S.pop==='bell')renderPop();if(!busy()){renderMain();if(S.sel)renderDrawer()}}
function signedOut(){seenN=null;const al=$('#alerts');if(al)al.innerHTML='';S.uid=null;S.pop='';S.nav=false;S.pwForm=false;SNAP=null;renderLogin()}
setInterval(()=>{if(S.uid&&!syncing)api('/api/version').then(v=>{if(DB&&v.version!==DB.version&&!syncing)refresh()}).catch(()=>{})},10000);

const me=()=>DB&&DB.users.find(u=>u.id===S.uid);
// Live alerts: a popup and a sound for every transaction that reaches this user from someone else.
let seenN=null,actx=null;
const sndOn=()=>{try{return localStorage.getItem('hwotg.sound')!=='off'}catch(e){return true}};

function audio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){actx=null}return actx}

  f.forEach((hz,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=t0+i*.15;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='done'?.08:.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.34)})}
const isBadN=n=>/SLA|rejected|undone/i.test(n.title),isOkN=n=>/accepted|closed|confirmed/i.test(n.title);

  el.innerHTML='<b>'+esc(n.title)+'</b><span>'+esc(n.text)+'</span><span class="ch">'+fdt(n.ts)+' · tap to open</span><button class="x3" data-act="alertx" aria-label="Dismiss">×</button>';
  box.prepend(el);while(box.children.length>4)box.lastChild.remove();setTimeout(()=>el.remove(),10000)}
function checkAlerts(){const u=me();if(!u)return;const a=notifFor();if(!seenN){seenN=new Set(a.map(n=>n.id));return}
  const fresh=a.filter(n=>!seenN.has(n.id));fresh.forEach(n=>seenN.add(n.id));const inc=fresh.filter(n=>n.by!==u.id).sort((x,y)=>x.ts-y.ts);if(!inc.length)return;
  inc.slice(-4).forEach(popup);beep(inc.some(isBadN)?'alert':'note');
  if(document.hidden&&window.Notification&&Notification.permission==='granted')inc.slice(-3).forEach(n=>{try{new Notification(n.title,{body:n.text,tag:n.id})}catch(e){}})}
const V=id=>DB.vendors.find(v=>v.id===id)||{name:'Unknown vendor',coverage:[],base:0,perKm:0,toll:0,air:0};

const FROM=r=>B(r.from),TO=r=>B(r.to);
const isEM=b=>ST(b.state).region==='East Malaysia';
const crossSea=(a,b)=>isEM(a)!==isEM(b);
function kmBetween(a,b){return crossSea(a,b)?18:Math.round(hav(a,b)*1.3+6)}
const gmap=b=>'https://www.google.com/maps/search/?api=1&query='+b.lat+','+b.lng;

function uname(n){return n.toLowerCase().replace(/[^a-z ]/g,'').trim().split(/\s+/).slice(0,2).join('.')}

/* ================= geo, SLA, cost ================= */
function hav(a,b){const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const jit=(p,m)=>({lat:+(p.lat+(R()-.5)*m).toFixed(5),lng:+(p.lng+(R()-.5)*m).toFixed(5)});
const statusOf=r=>{const t=r.t;if(t.completed)return'Completed';if(r.rejected&&t.decided)return'Rejected';if(t.vconfirm||t.decided)return'Accepted';if(t.delivered)return'Delivered';if(t.transit)return'In Transit';if(t.collected)return'Collected from Warehouse';if(t.assigned)return'Driver Assigned';if(t.validated)return'Pending Vendor Assignment';return'Request Created'};

const MET=[['response','Response','created','assigned'],['collection','Collection','assigned','collected'],['delivery','Delivery','collected','delivered'],['e2e','End-to-end','created',null]];
function target(k,s){const v=DB.sla[k];return typeof v==='object'?v[ZONE(s)]:v}
function metric(r,m){const s0=r.t[m[2]];if(!s0)return null;const endAll=r.t.completed||(r.rejected&&r.t.decided)||null;const e0=m[3]?r.t[m[3]]:endAll;const done=e0!=null;const e=done?e0:Date.now();const h=(e-s0)/H,tg=target(m[0],ST(r.st));return{k:m[0],n:m[1],h,tg,done,st:done?(h<=tg?'met':'breached'):(h>tg?'breached':h>=.75*tg?'near':'ok')}}
function slaOf(r){const ms=MET.map(m=>metric(r,m)).filter(Boolean);let c='green';if(ms.some(x=>x.st==='breached'))c='red';else if(ms.some(x=>x.st==='near'))c='amber';return{c,ms}}
const LBL={green:'Within SLA',amber:'Near breach',red:'Breached'};
const slaPill=r=>{const s=slaOf(r);return'<span class="sla '+s.c+'">'+LBL[s.c]+'</span>'};
const pill=s=>'<span class="pill" style="--c:'+SC[s]+'">'+s+'</span>';
function kmOf(s){const t=DB.bases.find(b=>b.type==='Store'&&b.state===s.id&&b.active!==false);return t?kmBetween(B('B00'),t):0}
function costOf(r){if(!r.vendor)return null;const v=V(r.vendor),F=FROM(r),T=TO(r),km=kmBetween(F,T),air=crossSea(F,T),rt=routeFor(r.from,r.to,r.vendor);
  let base,dist=0,toll=0,airc=0;if(rt){base=rt.price}else{base=v.base;dist=v.perKm*km;toll=air?0:v.toll*km;airc=air?v.air:0}
  const sub=base+dist+toll+airc,sur=sub*(DB.rates.sur[r.prio]||0),red=(r.redisp||0)*sub;
  return{km,base:r2(base),dist:r2(dist),toll:r2(toll),air:r2(airc),sur:r2(sur),red:r2(red),total:r2(sub+sur+red),basis:rt?'Route rate':'Formula',final:!!(r.t&&(r.t.completed||(r.rejected&&r.t.decided)))}}
const costView=r=>r.cost||costOf(r);
const costTot=r=>{const c=costView(r);return c?c.total:0};

/* ================= scope ================= */
function scope(){const u=me();if(!u)return[];let a=DB.reqs;if(u.role==='user')a=a.filter(r=>userSees(u,r));if(u.role==='vendor')a=a.filter(r=>r.vendor===u.vendor);if(u.role==='driver')a=a.filter(r=>r.driver===u.driver);return a}
function periodStart(){const p=S.period,now=new Date();if(p==='mtd')return new Date(now.getFullYear(),now.getMonth(),1).getTime();if(p==='all')return 0;return Date.now()-(+p)*D}
const PLBL={mtd:'Month to date','30':'Last 30 days','90':'Last 90 days','180':'Last 180 days',all:'All time'};
const inPeriod=a=>{const s=periodStart();return a.filter(r=>r.t.created>=s)};
function months(n){const o=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push({y:x.getFullYear(),m:x.getMonth(),l:x.toLocaleString('en-GB',{month:'short'})+(i===0?'*':'')})}return o}
const inMonth=(ts,mo)=>{if(!ts)return false;const d=new Date(ts);return d.getFullYear()===mo.y&&d.getMonth()===mo.m};

/* ================= notifications ================= */
const NOTE={created:['Request created',['hws']],validated:['Ready for driver assignment',['vendor']],assigned:['Driver assigned',['hws','user','driver']],collected:['Collection completed',['hws','vendor']],transit:['Delivery in transit',['user']],delivered:['Delivered, acceptance needed',['user','hws']],accepted:['Item accepted',['hws','vendor']],rejected:['Item rejected',['hws','vendor']],vconfirm:['Vendor confirmed completion',['hws','user']],completed:['Job closed',['user','vendor','driver']],redispatch:['Re-dispatched after rejection',['hws','user']],undo:['Step undone',['hws','vendor','driver','user']],sla:['SLA breach',['lead','vendor']]};
function notify(r,k,ts,title){const n=NOTE[k];if(!n)return;const u=me();DB.notifs.unshift({id:uid('n'),ts:ts||Date.now(),rid:r.id,by:u?u.id:'',title:title||n[0],text:r.no+' · '+TO(r).name,to:n[1],read:false,ch:chans()});if(DB.notifs.length>300)DB.notifs.length=300}
const chans=()=>[DB.ch.inapp&&'In-app',DB.ch.email&&'Email',DB.ch.teams&&'Teams',DB.ch.sms&&'SMS'].filter(Boolean);
function notifFor(){const u=me();if(!u)return[];return DB.notifs.filter(n=>{const r=DB.reqs.find(x=>x.id===n.rid);if(!r)return false;
  if(isLead(u))return n.to.includes('hws')||n.to.includes('lead');if(u.role==='hws')return n.to.includes('hws');
  if(u.role==='user')return n.to.includes('user')&&userSees(u,r);if(u.role==='vendor')return n.to.includes('vendor')&&r.vendor===u.vendor;
  if(u.role==='driver')return n.to.includes('driver')&&r.driver===u.driver;return false})}

/* ================= history ================= */
function evLabel(r,k){return{created:'Request created',validated:'Request validated, sent to '+(r.vendor?V(r.vendor).name:'vendor'),assigned:'Driver assigned: '+(r.driver&&DR(r.driver)?DR(r.driver).name:''),collected:'Collection proof uploaded',transit:'Delivery started, in transit',delivered:'Delivery proof and signature uploaded',decided:r.rejected?'Item rejected':'Item accepted',vconfirm:'Vendor confirmed completion',completed:'HWS validated, job closed'}[k]}
const EROLE={created:'Regional User',validated:'HWS',assigned:'Vendor Admin',collected:'Driver',transit:'Driver',delivered:'Driver',decided:'Regional User',vconfirm:'Vendor Admin',completed:'HWS'};
function hist(r){const a=[];EV.forEach(k=>{if(r.t[k])a.push({ts:r.t[k],user:r.who[k]||'',role:EROLE[k],action:evLabel(r,k),no:r.no,remarks:r.notes[k]||''})});r.log.forEach(l=>a.push({ts:l.ts,user:l.user,role:l.role,action:l.action,no:r.no,remarks:l.remarks||''}));return a.sort((x,y)=>x.ts-y.ts)}
const allEvents=()=>DB.reqs.flatMap(hist).concat(DB.audit).sort((a,b)=>b.ts-a.ts);

const ico=(n,sz)=>'<svg viewBox="0 0 24 24" width="'+(sz||18)+'" height="'+(sz||18)+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1.2?1.2:n<=1.6?1.6:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10;return m*p}
function line(labels,vals,o){o=o||{};const W=440,Hh=180,l=46,rr=16,t=18,b=26;const top=Math.max.apply(null,vals.concat([1]));const mn=o.min!=null?o.min:0,mx=o.max!=null?o.max:niceMax(top);
  const x=i=>l+(W-l-rr)*(labels.length<2?0:i/(labels.length-1)),y=v=>t+(Hh-t-b)*(1-(v-mn)/(mx-mn));const fm=o.fmt||(v=>Math.round(v)+(o.unit||''));
  let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+='<line class="gl" x1="'+l+'" x2="'+(W-rr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(l-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fm(v)+'</text>'}
  const cl=v=>Math.max(mn,Math.min(mx,v));const pts=vals.map((v,i)=>x(i)+','+y(cl(v)));const lx=x(vals.length-1),ly=y(cl(vals[vals.length-1]));
  const xl=labels.map((s,i)=>'<text class="ax" x="'+x(i)+'" y="'+(Hh-8)+'" text-anchor="middle">'+s+'</text>').join('');
  return'<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(o.label||'Trend')+'">'+g+'<path class="ar" d="M'+pts.join(' L')+' L'+lx+','+y(mn)+' L'+x(0)+','+y(mn)+'Z"/><polyline class="ln" points="'+pts.join(' ')+'"/><circle class="dot" cx="'+lx+'" cy="'+ly+'" r="5"/><text class="vl" x="'+lx+'" y="'+(ly-10)+'" text-anchor="end">'+fm(vals[vals.length-1])+'</text>'+xl+'</svg>'}
function vbar(labels,vals,o){o=o||{};const W=440,Hh=180,l=46,rr=10,t=20,b=26;const mx=niceMax(Math.max.apply(null,vals.concat([1]))*1.1);const bw=(W-l-rr)/labels.length;const y=v=>t+(Hh-t-b)*(1-v/mx);const fm=o.fmt||(v=>Math.round(v));
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+='<line class="gl" x1="'+l+'" x2="'+(W-rr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(l-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fm(v)+'</text>'}
  const bars=vals.map((v,i)=>{const x=l+bw*i+bw*.18;return'<rect class="bar-a" x="'+x+'" y="'+y(v)+'" width="'+bw*.64+'" height="'+Math.max(0,y(0)-y(v))+'" rx="2"/>'+(labels.length<=8&&v?'<text class="vl" x="'+(x+bw*.32)+'" y="'+(y(v)-5)+'" text-anchor="middle">'+(o.lbl?o.lbl(v):fm(v))+'</text>':'')+((labels.length<=8||i%2===0)?'<text class="ax" x="'+(x+bw*.32)+'" y="'+(Hh-8)+'" text-anchor="middle">'+labels[i]+'</text>':'')}).join('');
  return'<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(o.label||'Bar chart')+'">'+g+bars+'</svg>'}
function hbar(items,o){o=o||{};const mx=Math.max(1,...items.map(i=>i.v));const f=o.fmt||(v=>v+(o.unit||''));return'<div class="hb">'+items.map(i=>'<span class="lb" title="'+esc(i.l)+'">'+esc(i.l)+'</span><span class="tr"><i style="width:'+Math.max(1.5,i.v/mx*100)+'%;'+(i.c?'background:'+i.c:'')+'"></i></span><span class="n">'+f(i.v)+'</span>').join('')+'</div>'}
const hc=v=>v==null?'hn':v>=90?'hg':v>=75?'ha':'hr';
function heat(rows,cols,fn){let h='<div class="tw"><div class="heat" style="grid-template-columns:minmax(96px,1.3fr) repeat('+cols.length+',minmax(58px,1fr))"><div class="h rl"></div>'+cols.map(c=>'<div class="h">'+c+'</div>').join('');rows.forEach(r=>{h+='<div class="rl">'+r+'</div>';cols.forEach(c=>{const v=fn(r,c);h+='<div class="'+hc(v)+'">'+(v==null?'n/a':v+'%')+'</div>'})});return h+'</div></div>'}
const kpi=(l,v,s,t)=>'<div class="kpi '+(t||'')+'"><div class="l">'+l+'</div><div class="v" title="'+esc(String(v).replace(/<[^>]+>/g,''))+'">'+v+'</div><div class="s">'+(s||'&nbsp;')+'</div></div>';

function metPct(rs,key){const ms=rs.map(r=>slaOf(r).ms.find(m=>m.k===key)).filter(m=>m&&m.done);return ms.length?pct(ms.filter(m=>m.st==='met').length,ms.length):null}
const compliance=rs=>rs.length?pct(rs.filter(r=>slaOf(r).c!=='red').length,rs.length):0;
const slaCls=v=>v>=90?'green':v>=75?'amber':'red';
function attention(rs,n){const a=rs.filter(r=>isOpen(r)&&slaOf(r).c==='red').sort((x,y)=>x.t.created-y.t.created).slice(0,n);
  if(!a.length)return'<div class="empty">No open job is past its SLA.</div>';
  return'<div class="tw"><table class="t"><tbody>'+a.map(r=>'<tr class="rw" data-act="open" data-id="'+r.id+'"><td><span class="mono">'+r.no+'</span><div class="hint">'+esc(TO(r).name)+'</div></td><td>'+pill(statusOf(r))+'</td><td class="hide-m">'+esc(r.vendor?V(r.vendor).name:'Unassigned')+'</td><td>'+slaPill(r)+'</td></tr>').join('')+'</tbody></table></div>'}
function listTable(a){return'<div class="tw"><table class="t"><tbody>'+a.map(r=>'<tr class="rw" data-act="open" data-id="'+r.id+'"><td><span class="mono">'+r.no+'</span><div class="hint">'+esc(r.item)+' × '+r.qty+'</div></td><td>'+pill(statusOf(r))+'</td><td>'+slaPill(r)+'</td></tr>').join('')+'</tbody></table></div>'}

function viewOverview(){const all=scope(),rs=inPeriod(all);
  const tot=rs.length,done=rs.filter(r=>statusOf(r)==='Completed').length,rej=rs.filter(r=>r.rejected&&r.t.decided).length;
  const prog=rs.filter(isOpen).length,del=all.filter(r=>isOpen(r)&&slaOf(r).c==='red').length,cost=sum(rs.map(costTot));
  const mo=months(6),lab=mo.map(m=>m.l);
  let h=head('Dashboards','Executive overview','Spare-part deliveries across all states and vendors · '+PLBL[S.period],periodCtl());
  h+=jobBoard(all);
  h+='<div class="kpis">'+kpi('Total requests',tot,'Created in period','acc')+kpi('Completed',done,pct(done,tot)+'% of requests','ok')+kpi('In progress',prog,'Still open')+kpi('Delayed jobs',del,'Open and past SLA now',del?'bad':'')+kpi('Rejected deliveries',rej,pct(rej,tot)+'% of requests',rej?'warn':'')+kpi('SLA compliance',compliance(rs)+'%','Target 90%',compliance(rs)>=90?'ok':'warn')+kpi('Delivery cost',rmk(cost),'Actual + estimated')+'</div>';
  h+='<div class="grid g2">'+panel('Monthly requests and deliveries','last 6 months',twoSeries(lab,mo.map(m=>all.filter(r=>inMonth(r.t.created,m)).length),mo.map(m=>all.filter(r=>inMonth(r.t.delivered,m)).length)))+panel('Needs attention','open jobs past SLA',attention(all,6),true)+'</div>';
  h+='<div class="grid">'+panel('SLA performance trend','% of jobs within SLA',line(lab,mo.map(m=>compliance(all.filter(r=>inMonth(r.t.created,m)))),{min:50,max:100,unit:'%',label:'SLA trend'}))+panel('Requests by region','',hbar(REGIONS.map(g=>({l:g,v:rs.filter(r=>ST(r.st).region===g).length}))))+'</div>';
  h+='<div class="grid">'+panel('Requests by vendor','',hbar(DB.vendors.map(v=>({l:v.name,v:rs.filter(r=>r.vendor===v.id).length})).concat([{l:'Not yet assigned',v:rs.filter(r=>!r.vendor).length,c:'var(--muted)'}])))+panel('Requests by status','',hbar(STATUSES.map(s=>({l:s,v:rs.filter(r=>statusOf(r)===s).length,c:SC[s]}))))+'</div><p class="hint">* Current month to date.</p>';
  return h}
function twoSeries(lab,a,b){const W=520,Hh=200,l=40,rr=10,t=18,bt=26;const mx=niceMax(Math.max(...a,...b,1)*1.1);const bw=(W-l-rr)/lab.length;const y=v=>t+(Hh-t-bt)*(1-v/mx);

  lab.forEach((s,i)=>{const x=l+bw*i+bw*.16,w=bw*.32;g+='<rect class="bar-a" x="'+x+'" y="'+y(a[i])+'" width="'+w+'" height="'+(y(0)-y(a[i]))+'" rx="2"><title>'+s+': '+a[i]+' requested</title></rect><rect class="bar-b" x="'+(x+w+2)+'" y="'+y(b[i])+'" width="'+w+'" height="'+(y(0)-y(b[i]))+'" rx="2"><title>'+s+': '+b[i]+' delivered</title></rect><text class="ax" x="'+(x+w)+'" y="'+(Hh-8)+'" text-anchor="middle">'+s+'</text>'});

  h+='<p class="hint">Each job uses the route rate for its collection point, destination and vendor when one is registered. Otherwise it uses the vendor formula: base fee + distance × rate + toll + air freight (East Malaysia). Priority surcharge and re-dispatch legs are added on top. Extra = surcharge + re-dispatch. Closed jobs keep the cost they closed with; open jobs use the current rate card.</p>';

  return{asg:a.length,done:dl.length,succ:dec.length?pct(ok.length,dec.length):null,avgH:dh.length?avg(dh):null,active:DB.reqs.filter(r=>r.driver===d.id&&ACTIVE.includes(statusOf(r))).length,util:Math.min(100,pct(a.length,14)),sla:a.length?compliance(a):null}}

const fileIco=f=>/^image\//.test(f.type)?'<img src="'+f.data+'" alt="" class="fi">':'<span class="fi ft">'+esc((f.name.split('.').pop()||'file').toUpperCase().slice(0,4))+'</span>';
function procFile(f){return new Promise(res=>{const fr=new FileReader();
  const done=(name,type,d)=>{const size=Math.round((d.length-d.indexOf(',')-1)*.75);if(size>MAXB)res({err:name+' is over 8 MB. Each file must be under 8 MB.'});else res({name,type,size,data:d})};
  fr.onerror=()=>res({err:'Could not read '+f.name});
  fr.onload=()=>{const data=String(fr.result);if(/^image\/(jpeg|png|webp)$/.test(f.type)){const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);done(f.name.replace(/\.[^.]+$/,'')+'.jpg','image/jpeg',cv.toDataURL('image/jpeg',.75))};im.onerror=()=>done(f.name,f.type,data);im.src=data}else done(f.name,f.type||'application/octet-stream',data)};
  fr.readAsDataURL(f)})}

  if(u.role==='vendor')return s==='Pending Vendor Assignment'?'new':(s==='Completed'||s==='Rejected'||(s==='Accepted'&&r.t.vconfirm))?'done':'cur';
  if(u.role==='driver')return s==='Driver Assigned'?'new':ACTIVE.includes(s)?'cur':'done';
  return['Request Created','Pending Vendor Assignment'].includes(s)?'new':['Accepted','Completed','Rejected'].includes(s)?'done':'cur'}

function initSig(){const c=$('#sig');if(!c)return;const ratio=window.devicePixelRatio||1,b=c.getBoundingClientRect();c.width=Math.max(1,b.width*ratio);c.height=Math.max(1,b.height*ratio);const x=c.getContext('2d');x.scale(ratio,ratio);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#14213a';let dn=false;
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.addEventListener('pointerdown',e=>{dn=true;try{c.setPointerCapture(e.pointerId)}catch(x2){}const p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);S.tmp.sig=true});
  c.addEventListener('pointermove',e=>{if(!dn)return;const p=pos(e);x.lineTo(p[0],p[1]);x.stroke()});
  const up=()=>{dn=false};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function readImg(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};im.onerror=()=>cb(null);im.src=fr.result};fr.readAsDataURL(file)}

function doAction(d){const r=DB.reqs.find(x=>x.id===S.sel);if(!r)return;const u=me();
  if(d==='validate'){r.vendor=$('#a-vendor').value;stamp(r,'validated',u.name,'Vendor '+V(r.vendor).name);notify(r,'validated')}

    r.proof.collection={gps:S.tmp.gps,ts:Date.now(),driver:u.name,photo:S.tmp.col};stamp(r,'collected',u.name,S.tmp.gpsSim?'GPS simulated':'');notify(r,'collected')}

/* ---------- administrator undo: one workflow step at a time, newest first ---------- */
const UNDO={validated:'vendor selection',assigned:'driver assignment',collected:'collection',transit:'delivery start',delivered:'delivery',decided:'store decision',vconfirm:'vendor confirmation',completed:'job closing'};
const lastStage=r=>EV.filter(k=>r.t[k]).pop();
function undoStep(r,u,why){const k=lastStage(r);if(!k||k==='created')return'';const lbl=evLabel(r,k);
  delete r.t[k];delete r.who[k];delete r.notes[k];
  if(k==='validated')r.vendor=null;
  if(k==='assigned'){r.driver=null;r.sched=null}
  if(k==='collected'){delete r.proof.collection;r.verified=false}
  if(k==='delivered'){delete r.proof.delivery;r.gpsFlag=false;r.verified=false}
  if(k==='decided')r.rejected=false;
  r.cost=(r.t.completed||(r.rejected&&r.t.decided))?costOf(r):null;
  r.log.push({ts:Date.now(),user:u.name,role:ROLE[u.role],action:'Undone: '+lbl,remarks:why});
  notify(r,'undo',0,'Step undone: '+UNDO[k]);return UNDO[k]}
function adminPanel(r){const k=lastStage(r),why='<label class="hint" style="display:grid;gap:4px;margin-top:10px">Reason (optional, saved in the activity log)<input id="undo-why" placeholder="e.g. driver tapped the wrong job"></label>';
  return panel('Administrator controls','undo a step or correct the record','<div class="row">'+(k&&k!=='created'?'<button class="btn dng" data-act="undo">Undo '+esc(UNDO[k])+'</button>':'<span class="hint">Only the request itself is left. Delete it if it was raised by mistake.</span>')
    +(r.verified?'<button class="btn" data-act="adm-fix" data-k="unverify">Undo proof verification</button>':'')+(r.escalated?'<button class="btn" data-act="adm-fix" data-k="unesc">Clear escalation</button>':'')+'<button class="btn" data-act="delreq">Delete request</button></div>'+why
    +'<p class="hint" style="margin:8px 0 0">Steps are undone one at a time, newest first, so you can go back as far as needed. Photos, signature and cost captured in an undone step are cleared, and everyone on the job is notified.</p>')}
function adminDo(a,k){const r=DB.reqs.find(x=>x.id===S.sel),u=me();if(!r||u.role!=='admin')return;const w=$('#undo-why'),why=w?w.value.trim():'';
  if(a==='undo'){const s=undoStep(r,u,why);if(!s)return;toast('Undone: '+s)}
  else if(a==='unverify'){r.verified=false;r.log.push({ts:Date.now(),user:u.name,role:ROLE[u.role],action:'Undone: proof verification',remarks:why});toast('Proof verification undone')}
  else if(a==='unesc'){r.escalated=false;r.log.push({ts:Date.now(),user:u.name,role:ROLE[u.role],action:'Escalation cleared',remarks:why});toast('Escalation cleared')}
  else if(a==='delreq'){DB.reqs=DB.reqs.filter(x=>x!==r);DB.notifs=DB.notifs.filter(n=>n.rid!==r.id);audit('Request deleted',r.no+(why?' · '+why:''));closeDrawer();toast('Deleted '+r.no)}
  beep('done');changed()}

  if(k==='user'){if(id===u.id){toast('You cannot delete your own account.');return}const i=DB.users.findIndex(x=>x.id===id);if(i<0)return;const x=DB.users[i];DB.users.splice(i,1);audit('User deleted',x.name+' ('+ROLE[x.role]+')');toast('Deleted '+x.name+'. Their past requests keep the contact details.')}
  else if(k==='base'){const b=DB.bases.find(x=>x.id===id);if(!b)return;const used=DB.reqs.filter(r=>r.from===id||r.to===id).length;if(used){b.active=false;audit('Base removed',b.name+' (kept on '+used+' existing jobs)');toast(b.name+' is removed from lists. It stays on '+used+' existing jobs.')}else{DB.bases.splice(DB.bases.indexOf(b),1);DB.routes=DB.routes.filter(x=>x.from!==id&&x.to!==id);DB.users.forEach(x=>{if(x.base===id)x.base=''});audit('Base deleted',b.name);toast('Deleted '+b.name)}}
  else if(k==='route'){const i=DB.routes.findIndex(x=>x.id===id);if(i<0)return;const x=DB.routes[i];DB.routes.splice(i,1);audit('Route rate deleted',B(x.from).name+' → '+B(x.to).name+(x.vendor?' · '+V(x.vendor).name:' · any vendor')+' · RM '+x.price);toast('Route rate deleted')}
  save();renderMain()}
function submitVendor(e){e.preventDefault();const g=id=>$(id).value.trim();const er=$('#fv-err');const name=g('#fv-name'),contact=g('#fv-contact');const cov=[...document.querySelectorAll('[data-cov]')].filter(c=>c.checked).map(c=>c.dataset.cov);
  if(!name||!contact){er.textContent='Enter the company and contact person.';return}if(!cov.length){er.textContent='Pick at least one coverage region.';return}
  const v={id:uid('V'),name,regNo:g('#fv-reg'),contact,phone:g('#fv-phone'),email:g('#fv-email'),coverage:cov,base:+g('#fv-base')||0,perKm:+g('#fv-km')||0,toll:+g('#fv-toll')||0,air:+g('#fv-air')||0,active:true};
  DB.vendors.push(v);let note='';if($('#fv-admin').checked){let un=uname(contact);if(DB.users.some(x=>x.username===un))un+=DB.users.length;DB.users.push({id:uid('U'),username:un,name:contact,role:'vendor',vendor:v.id,pw:'welcome123',email:v.email,phone:v.phone,active:true});note=' Vendor admin login: '+un}
  audit('Vendor registered',name+(note?' with vendor admin login':''));save();S.form=null;toast('Registered '+name+'.'+note);renderMain()}
function submitDriver(e){e.preventDefault();const g=id=>$(id).value.trim();const er=$('#fd-err');const name=g('#fd-name'),phone=g('#fd-phone'),plate=g('#fd-plate').toUpperCase();
  if(!g('#fd-vendor')){er.textContent='Register an active vendor first, under the Vendors tab.';return}
  if(!name||!phone||!plate){er.textContent='Enter name, mobile number and plate number.';return}
  const un=(g('#fd-user')||uname(name)).toLowerCase();if(DB.users.some(x=>x.username===un)){er.textContent='Username '+un+' is taken. Enter a different one.';return}
  const d={id:uid('D'),name,vendor:g('#fd-vendor'),phone,plate,vehicle:g('#fd-veh'),active:true};DB.drivers.push(d);
  DB.users.push({id:uid('U'),username:un,name,role:'driver',driver:d.id,vendor:d.vendor,pw:'welcome123',email:'',phone,active:true});
  audit('Driver registered',name+' · '+V(d.vendor).name+' · login '+un);save();S.form=null;toast('Registered '+name+'. Login: '+un);renderMain()}

/* ================= files: export & download ================= */
const LIB={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',at:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'};
const loaded={};
const HAS={xlsx:()=>window.XLSX,jspdf:()=>window.jspdf,at:()=>window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable};
function loadLib(k){if(HAS[k]())return Promise.resolve();if(!loaded[k])loaded[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB[k];s.onload=res;s.onerror=()=>{loaded[k]=null;rej(new Error('Could not load the export library. Check the internet connection.'))};document.head.appendChild(s)});return loaded[k]}
let dlCap;
function getDl(){if(dlCap===undefined)dlCap=(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null);return dlCap}
function blobToB64(b){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(b)})}
async function saveFile(name,blob){
  if(window.HWOTGAndroid&&window.HWOTGAndroid.saveFile){const b=await blobToB64(blob);window.HWOTGAndroid.saveFile(name,b,blob.type||'application/octet-stream');return}
  const dl=await getDl();
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name)}catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not save '+name+(e&&e.message?': '+e.message:''))}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Downloading '+name)}
const stamp8=()=>{const d=new Date();return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};
async function exportData(key,fmt){const d=key==='report'?reportData():reportData(key);const base='HWOTG_'+d.t.replace(/[^A-Za-z0-9]+/g,'_')+'_'+stamp8();
  if(!d.rows.length){toast('Nothing to export for this selection.');return}
  try{
    if(fmt==='csv'){const txt='﻿'+[d.h].concat(d.rows).map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');await saveFile(base+'.csv',new Blob([txt],{type:'text/csv'}))}
    else if(fmt==='xlsx'){toast('Preparing Excel file…');await loadLib('xlsx');const X=window.XLSX;const ws=X.utils.aoa_to_sheet([d.h].concat(d.rows));ws['!cols']=d.h.map((h,i)=>({wch:Math.min(40,Math.max(h.length,...d.rows.slice(0,200).map(r=>String(r[i]==null?'':r[i]).length))+2)}));const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,d.t.slice(0,31));
      const info=X.utils.aoa_to_sheet([['Report',d.t],['Period',PLBL[S.period]],['Generated',iso(Date.now())],['Generated by',me().name+' ('+ROLE[me().role]+')'],['Rows',d.rows.length]]);X.utils.book_append_sheet(wb,info,'About');
      const out=X.write(wb,{bookType:'xlsx',type:'array'});await saveFile(base+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
    else{toast('Preparing PDF…');await loadLib('jspdf');await loadLib('at');const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
      doc.setFontSize(14);doc.text('HWOTG Delivery Tracking · '+d.t,40,40);doc.setFontSize(9);doc.setTextColor(90);doc.text(PLBL[S.period]+' · generated '+iso(Date.now())+' by '+me().name+' · '+d.rows.length+' rows',40,56);
      doc.autoTable({head:[d.h],body:d.rows.map(r=>r.map(c=>c==null?'':String(c))),startY:68,styles:{fontSize:d.h.length>10?6.5:8,cellPadding:3},headStyles:{fillColor:[19,37,59]},margin:{left:40,right:40},didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('Page '+doc.internal.getNumberOfPages(),doc.internal.pageSize.getWidth()-80,doc.internal.pageSize.getHeight()-20)}});
      await saveFile(base+'.pdf',doc.output('blob'))}
    audit('Report exported',d.t+' ('+fmt.toUpperCase()+', '+d.rows.length+' rows)');save();
  }catch(e){toast(e.message||'Export failed')}}
function toJpg(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth||480;c.height=im.naturalHeight||200;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res({d:c.toDataURL('image/jpeg',.85),w:c.width,h:c.height})};im.onerror=()=>res(null);im.src=src})}
function dataUrlBlob(d){const p=d.split(','),bin=atob(p[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(p[0].match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function dlPhoto(kind){const r=DB.reqs.find(x=>x.id===S.sel);const p=r.proof[kind==='col'?'collection':'delivery'];const im=await toJpg(p.photo||sample('Photo · '+r.no,kind));if(!im)return;saveFile((kind==='col'?'COL-':'POD-')+r.no+'.jpg',dataUrlBlob(im.d))}
async function proofPdf(){const r=DB.reqs.find(x=>x.id===S.sel);try{toast('Preparing PDF…');await loadLib('jspdf');const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});const s=ST(r.st);let y=48;
  doc.setFontSize(15);doc.text('Proof of collection and delivery',40,y);y+=18;doc.setFontSize(10);doc.setTextColor(80);doc.text(r.no+' · '+FROM(r).name+' to '+TO(r).name+' · '+r.item+' x '+r.qty,40,y);y+=24;doc.setTextColor(20);
  for(const [k,t] of [['collection','Collection'],['delivery','Delivery']]){const p=r.proof[k];if(!p)continue;doc.setFontSize(12);doc.text(t+' proof',40,y);y+=16;doc.setFontSize(9.5);
    const lines=['Timestamp: '+iso(p.ts),'Driver: '+p.driver,'GPS: '+p.gps.lat+', '+p.gps.lng].concat(k==='delivery'?['Recipient: '+p.recipient]:[]);lines.forEach(l=>{doc.text(l,40,y);y+=13});
    const im=await toJpg(p.photo||sample('Photo · '+r.no,k==='collection'?'col':'del'));if(im){const w=260,h=w*im.h/im.w;doc.addImage(im.d,'JPEG',40,y,w,h);if(k==='delivery'){const sg=await toJpg(p.sig||sigSample());if(sg){doc.text('Signature',320,y+10);doc.addImage(sg.d,'JPEG',320,y+16,180,180*sg.h/sg.w)}}y+=h+24}}
  doc.setFontSize(8);doc.setTextColor(120);doc.text('Generated '+iso(Date.now())+' by '+me().name,40,800);await saveFile('Proof_'+r.no+'.pdf',doc.output('blob'))}catch(e){toast(e.message||'Could not create PDF')}}

/* ================= GPS ================= */
function captureGps(kind){const r=DB.reqs.find(x=>x.id===S.sel),tg=kind==='wh'?FROM(r):TO(r),o=$('#gps-o');if(o)o.textContent='Getting location…';
  const sim=why=>{S.tmp.gps=jit(tg,.0016);S.tmp.gpsSim=true;if(o)o.textContent=S.tmp.gps.lat+', '+S.tmp.gps.lng+' · '+Math.round(hav(S.tmp.gps,tg)*1000)+' m from '+(kind==='wh'?'collection point':'destination')+' (simulated: '+why+')'};
  if(!navigator.geolocation)return sim('no GPS on this device');
  let done=false;const to=setTimeout(()=>{if(!done){done=true;sim('location timed out')}},9000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(to);S.tmp.gps={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)};S.tmp.gpsSim=false;const dm=Math.round(hav(S.tmp.gps,tg)*1000);if(o)o.textContent=S.tmp.gps.lat+', '+S.tmp.gps.lng+' · ±'+Math.round(p.coords.accuracy)+' m · '+(dm>300?dm+' m from '+(kind==='wh'?'collection point':'destination')+', will be flagged':'on site')},()=>{if(done)return;done=true;clearTimeout(to);sim('location not available here')},{enableHighAccuracy:true,timeout:8000,maximumAge:0})}catch(e){done=true;clearTimeout(to);sim('location blocked')}}

/* ================= events ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');
  if(!t){if(S.pop&&!e.target.closest('#pop')){S.pop='';renderPop()}return}
  const a=t.dataset.act;
  if(a!=='bell'&&a!=='acct'&&S.pop&&!t.closest('#pop')){S.pop='';renderPop()}
  if(a==='nav'){S.view=t.dataset.v;S.lim=25;S.form=null;if(t.dataset.k)S.adm=t.dataset.k;setNav(false);renderNav();renderMain();window.scrollTo(0,0)}
  else if(a==='open'){if(t.classList.contains('alert'))t.remove();if(t.dataset.n){const n=DB.notifs.find(x=>x.id===t.dataset.n);if(n){n.read=true;save()}S.pop='';renderPop();renderBadge()}openDrawer(+t.dataset.id)}
  else if(a==='close')closeDrawer();
  else if(a==='menu')setNav(!S.nav);
  else if(a==='sbox'){const b=$('#sbox');b.classList.toggle('open');if(b.classList.contains('open'))$('#q').focus()}
  else if(a==='bell'||a==='acct'){S.pop=S.pop===a?'':a;renderPop();e.stopPropagation()}
  else if(a==='readall'){notifFor().forEach(n=>n.read=true);save();renderPop();renderBadge()}
  else if(a==='logout'){syncQ.then(()=>api('/api/logout',{})).catch(()=>{}).finally(signedOut)}
  else if(a==='pwform'){S.pwForm=!S.pwForm;renderPop()}
  else if(a==='pwsave')changePw();
  else if(a==='resetPw'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Confirm reset';t.classList.add('dng');return}const x=DB.users.find(y=>y.id===t.dataset.k);if(x){x.pw='welcome123';audit('Password reset',x.name);save();toast('Password for '+x.name+' reset to welcome123. They are signed out everywhere.');renderMain()}}
  else if(a==='more'){S.lim+=25;renderMain()}
  else if(a==='costmore'){S.costLim+=20;renderMain()}
  else if(a==='clr'){resetF();S.q='';$('#q').value='';renderMain()}
  else if(a==='period'){S.period=t.dataset.k;renderMain()}
  else if(a==='mapm'){S.mapM=t.dataset.k;renderMain()}
  else if(a==='mapsel'){S.mapSel=t.dataset.k||null;renderMain()}
  else if(a==='stateReq'){resetF();S.f.state=t.dataset.k;S.view='requests';renderNav();renderMain();window.scrollTo(0,0)}
  else if(a==='rep'){S.rep=t.dataset.k;renderMain()}
  else if(a==='adm'){S.adm=t.dataset.k;S.form=null;renderMain()}
  else if(a==='form'){S.form=t.dataset.k||null;renderMain()}
  else if(a==='toggleUser'){const x=DB.users.find(y=>y.id===t.dataset.k);x.active=!x.active;audit(x.active?'User activated':'User deactivated',x.name);save();renderMain()}
  else if(a==='toggleVendor'){const v=DB.vendors.find(y=>y.id===t.dataset.k);v.active=!v.active;audit(v.active?'Vendor activated':'Vendor deactivated',v.name);save();renderMain()}
  else if(a==='do')doAction(t.dataset.d);
  else if(a==='bk-save'&&LOCAL){syncQ.then(()=>LOCAL.exportAll()).then(d=>saveFile('HWOTG_backup_'+stamp8()+'.json',new Blob([JSON.stringify(d)],{type:'application/json'}))).catch(e=>toast(e.message||'Backup failed'))}
  else if(a==='bk-wipe'&&LOCAL){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Select again to delete everything';return}syncQ.then(()=>LOCAL.wipe()).then(()=>{signedOut();toast('All data deleted. Sign in with msyafirol / admin123.')})}
  else if(a==='undo'||a==='delreq'||a==='adm-fix'){if((a!=='adm-fix')&&!t.dataset.sure){t.dataset.sure='1';t.textContent=a==='undo'?'Select again to undo':'Select again to delete';return}adminDo(a==='adm-fix'?t.dataset.k:a)}
  else if(a==='jt'){S.jt=t.dataset.k;S.jlim=10;renderMain()}
  else if(a==='jmore'){S.jlim+=10;renderMain()}
  else if(a==='alertx'){const el=t.closest('.alert');if(el)el.remove()}
  else if(a==='sound'){setSound(!sndOn());renderPop()}
  else if(a==='desk'){if(window.Notification)Notification.requestPermission().then(()=>renderPop())}
  else if(a==='scan'){const r=DB.reqs.find(x=>x.id===S.sel);$('#a-scan').value=r.no;toast('Label scanned (simulated in this preview)')}
  else if(a==='gps')captureGps(t.dataset.t);
  else if(a==='sigclr'){const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);S.tmp.sig=false}
  else if(a==='exp')exportData(t.dataset.k,t.dataset.fmt);
  else if(a==='dlphoto')dlPhoto(t.dataset.k);
  else if(a==='proofpdf')proofPdf();
  else if(a==='del'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Confirm delete';t.classList.add('dng');return}delRecord(t.dataset.k,t.dataset.id)}
  else if(a==='restoreBase'){const b=DB.bases.find(x=>x.id===t.dataset.id);if(b){b.active=true;audit('Base restored',b.name);save();renderMain()}}
  else if(a==='attdl')attDownload(t.dataset.id);
  else if(a==='attdel'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Confirm';t.classList.add('dng');return}attDelete(t.dataset.id)}
  else if(a==='nrfdel'){S.nr.files[t.dataset.k].splice(+t.dataset.i,1);nrFiles()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.sel)closeDrawer();else if(S.pop){S.pop='';renderPop()}else if(S.nav)setNav(false)}
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('bub')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.restore!==undefined&&t.files&&t.files[0]&&LOCAL){const f=t.files[0];t.value='';f.text().then(x=>LOCAL.importAll(JSON.parse(x))).then(()=>{signedOut();toast('Backup restored. Sign in again.')},e=>toast(e instanceof SyntaxError?'This file is not an HWOTG backup.':e.message));return}
  if(t.dataset.att&&t.files&&t.files.length){addAttachments(t.dataset.att,t.files);t.value='';return}
  if(t.dataset.nrf&&t.files&&t.files.length){nrAddFiles(t.dataset.nrf,t.files);return}
  if(t.dataset.nr!==undefined){nrSync(t.dataset.nr);return}
  if(t.dataset.fr!==undefined){frHint();return}
  if(t.dataset.f!==undefined&&t.closest('.flt')){S.f[t.dataset.f]=t.value;S.lim=25;renderMain()}
  else if(t.dataset.vsel!==undefined){S.vsel=t.value;renderMain()}
  else if(t.dataset.sla){const v=parseFloat(t.value);if(v>0){if(t.dataset.z)DB.sla[t.dataset.sla][t.dataset.z]=v;else DB.sla[t.dataset.sla]=v;audit('SLA target changed',t.dataset.sla+(t.dataset.z?' zone '+t.dataset.z:'')+' = '+v+' h');save();renderMain()}}
  else if(t.dataset.rate){const v=parseFloat(t.value);if(v>=0){const vv=V(t.dataset.rate);vv[t.dataset.k]=v;audit('Rate card changed',vv.name+' '+t.dataset.k+' = RM '+v);save();toast('Rate updated');renderMain()}}
  else if(t.dataset.sur){const v=parseFloat(t.value);if(v>=0){DB.rates.sur[t.dataset.sur]=v/100;audit('Surcharge changed',t.dataset.sur+' = '+v+'%');save();toast('Surcharge updated')}}
  else if(t.dataset.ch){DB.ch[t.dataset.ch]=t.checked;audit('Notification channel '+(t.checked?'enabled':'disabled'),t.dataset.ch);save();toast('Notification channels updated')}
  else if(t.dataset.up&&t.files&&t.files[0]){const k=t.dataset.up;if(k==='ack'){S.tmp.ack=t.files[0].name;toast('Attached '+t.files[0].name)}else readImg(t.files[0],u=>{if(!u){toast('That file is not an image.');return}S.tmp[k]=u;const p=$('#prev');if(p)p.innerHTML='<img src="'+u+'" alt="Photo preview" style="max-height:150px;border-radius:6px;max-width:100%">'})}});
document.addEventListener('input',e=>{if(e.target.id==='fb-addr'){const a=$('#fb-gm');if(a)a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.target.value)}});
// Android back button (used by the APK wrapper): returns true when the app handled it
window.hwotgBack=function(){if(S.sel){closeDrawer();return true}if(S.pop){S.pop='';renderPop();return true}if(S.nav){setNav(false);return true}if(me()&&S.view!==home()){S.view=home();renderNav();renderMain();return true}return false};

/* ================= boot ================= */
resetF();
loadData().then(()=>{if(!me())return signedOut();S.view=home();shell();full();checkAlerts()},()=>{if(!S.uid)renderLogin()});
getDl();
})();
